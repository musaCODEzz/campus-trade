{% extends 'base.html' %}

{% block title %}Register — CampusTrade{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">

        <div class="auth-header">
            <h2>Create Account</h2>
            <p class="auth-subtitle">Join the campus marketplace. Students only.</p>
        </div>

        {% if error %}
            <p class="auth-error">⚠️ {{ error }}</p>
        {% endif %}

        <form method="POST" class="auth-form">
            {% csrf_token %}

            <p>
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="Choose a username" required>
            </p>

            <p>
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="student@example.ac.ke" required>
            </p>

            <p>
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Create password" required>
            </p>

            <button type="submit" class="btn-auth">Create Account →</button>
        </form>

        <p class="auth-switch">
            Already have an account? <a href="{% url 'login' %}">Log in here</a>
        </p>

    </div>
</section>
{% endblock %}
