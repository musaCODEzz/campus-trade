{% extends 'base.html' %}

{% block title %}Contact Support — CampusTrade{% endblock %}

{% block content %}
    <div class="page-container">
        <div class="form-box">
            <h2 style="margin-bottom: 8px;">Contact CampusTrade Support</h2>
            <p style="color: #64748b; margin-bottom: 24px;">Have questions or feedback? Send our team a message below.</p>

            <form action="#" method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Musa Mwenda" required>
                </div>
                <div class="form-group">
                    <label for="email">Student Email</label>
                    <input type="email" id="email" name="email" placeholder="musa@student.ac.ke" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="How can we help you?" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Send Message</button>
            </form>
        </div>
    </div>
{% endblock %}
